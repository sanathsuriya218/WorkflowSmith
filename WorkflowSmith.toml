[tool.poetry]
name = "workflowsmith"
version = "0.1.0"
description = "Autonomous multi-agent system for data pipeline monitoring and repair"
authors = ["WorkflowSmith Team"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
langgraph = "^0.2.0"
langchain = "^0.2.0"
langchain-openai = "^0.1.0"
langchain-google-genai = "^1.0.0"
openai = "^1.30.0"
sqlalchemy = "^2.0.0"
pandas = "^2.2.0"
pytest = "^8.0.0"
pydantic = "^2.7.0"
python-dotenv = "^1.0.0"
alembic = "^1.13.0"
rich = "^13.7.0"
numpy = "^1.26.0"

[tool.poetry.group.dev.dependencies]
pytest-cov = "^5.0.0"
pytest-asyncio = "^0.23.0"
black = "^24.0.0"
ruff = "^0.4.0"
mypy = "^1.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=html --cov-report=term"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
